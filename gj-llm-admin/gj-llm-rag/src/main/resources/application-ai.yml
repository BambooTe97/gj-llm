spring:
  # ==================== AI 配置 ====================
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
#         model: deepseek-r1:latest
#        model: qwen3:8b
        model: gemma2:2b
      embedding:
        model: bge-m3:latest
    # MCP Server 端点(Starter 装配):Streamable HTTP,挂 /open/mcp
    # 认证走 mcp 模块的 API Key 拦截器(/open/** 双层放行后的唯一闸门),不走 JWT
    mcp:
      server:
        enabled: true
        name: gj-llm-knowledge
        version: 1.0.0
        protocol: STREAMABLE
        streamable-http:
          # 端点必须落在 /open/** 下:Security permitAll + 权限拦截器排除,认证完全由 API Key 承担
          mcp-endpoint: /open/mcp
    vectorstore:
      milvus:
        initialize-schema: false
        database-name: default
        collection-name: vector_store_first
        embedding-dimension: 1024
        index-type: hnsw
        metric-type: cosine
        client:
#          host: 192.168.40.130
          host: 192.168.50.109
          port: 19530
          username: root
          password: milvus

# ==================== ES 配置（主要检索引擎） ====================
gj:
  llm:
    # 数据授权(库级可见域隔离):原语在 gj-base-admin,组合判定在 rag 的 DatasetVisibleService
    auth:
      # 授权/角色/可见集 Redis 缓存 TTL(秒,兜底;授权与库变更走主动失效)
      cache-ttl-seconds: 60
      # 新建知识库默认可见性:PUBLIC=全员可见(保现状) / RESTRICTED=仅 owner+授权主体
      default-visibility: PUBLIC
      # 管理员角色编码(命中即全库可见可管),大小写不敏感
      admin-roles: [ADMIN]
    es:
#      host: 192.168.40.130
      host: 192.168.50.109
      port: 9200
      index-prefix: rag_
      embedding-dimension: 1024
      shards: 1
      replicas: 0
    reranker:
      enabled: true
#      host: 192.168.40.130
      host: 192.168.50.109
      port: 3000
      timeout: 30000
    # rag 自配的查询改写模型(独立于 chat 对话模型);为空则用默认 ChatModel
    rag:
      rewrite-model: gemma2:2b
      # 稠密检索(dense)来源:milvus(向量走 Milvus,ES 只做 BM25,省内存)| es(ES 做 KNN)
      # 切换需重建向量库。两条代码路径(DenseRetriever)都保留,按此配置激活其一。
      dense:
        provider: milvus
      # 智能路由:按库数自适应(≤ fanout-threshold 全库多路召回,仅判意图;
      # 超过则 LLM 选库,每问最多 max-datasets 个,防小模型选错漏答/幻觉编号)
      routing:
        fanout-threshold: 8
        max-datasets: 2
        planner-timeout-ms: 8000
        dataset-cache-ttl-seconds: 60
        # 规划模型,空则复用 rewrite-model
        planner-model: gemma2:2b
        # 问题拆解:检索意图下让规划器把复合问题拆成多个子问题,逐子问题检索后合并
        # (默认关,先经测评对比验证有正收益再开;开启后 numPredict 上限自动放宽)
        decomposition-enabled: false
        # 拆解的最大子问题数(超过截断)
        max-sub-queries: 3
        # 拆解后是否仍对原始问题做一路检索(安全网:拆解质量差时召回不劣于单查询路径)
        decomposition-include-original: true
    # chat 智能体编排平台:声明智能体 + 路由规则
    # 加内部智能体=加 bean;加外部/市面智能体=在此声明 type:remote + endpoint
    chat:
      agents:
        rag-qa:   { type: internal, model: gemma2:2b, thinking: true, num-predict: 4096 }
        chitchat: { type: internal, model: gemma2:2b, thinking: true, num-predict: 4096 }
        # 工具循环智能体:模型自主调用知识库检索/外部MCP工具,须用支持 function calling 的模型
        # (gemma2 不支持工具调用;切换 qwen3:8b 等后,把 default-agent 改为 tool-call 即可实验)
        tool-call: { type: internal, model: gemma2:2b, thinking: false, num-predict: 4096 }
        # 外部智能体示例(默认注释,启用即接入):
        # dify-cs: { type: remote, endpoint: http://dify.local/v1/chat-messages, auth-header: "Bearer ${DIFY_KEY}" }
      routing:
        default-agent: chitchat
        rules:
          - agent: rag-qa
            has-dataset: true

    # ==================== MCP 配置 ====================
    mcp:
      server:
        # 平台侧总开关(与 spring.ai.mcp.server.enabled 双闸):false 时不暴露知识库工具
        enabled: true
        name: gj-llm-knowledge
      client:
        # 全局外部工具总开关(false 时工具循环智能体只用内置检索工具)
        enabled: true
        request-timeout-ms: 30000
        health-check-interval-ms: 60000
        init-timeout-ms: 10000
      crypto:
        # 外部服务凭据加密密钥(Base64 32字节);空=开发派生密钥+WARN,生产必须配置: ${MCP_CRYPTO_SECRET}
        secret: ""
      audit:
        params-max-length: 512
