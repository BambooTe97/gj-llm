spring:
  application:
    name: gj-llm

  profiles:
    active: ai, mybatis, file, redis

  # ==================== 国际化 ====================
  # basename 为中文默认文件（i18n/base_messages.properties 即兜底）；
  # 后续模块加词条时新建 i18n/<module>_messages 并以逗号追加（多模块禁止同名 basename）
  messages:
    basename: i18n/base_messages
    fallback-to-system-locale: false
    encoding: UTF-8

  # ==================== 文件上传配置 ====================
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # ==================== 数据库配置 ====================
  datasource:
#    url: jdbc:mysql://localhost:3306/gj_llm?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    url: jdbc:mysql://192.168.50.109:3306/gj_llm?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
#    password: Xx123@pwd
    password: 111111
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    com.gj.llm: info
    org.springframework: warn
    org.springframework.web.servlet.mvc.method.annotation: warn

# ==================== 安全配置 ====================
app:
  security:
    jwt:
      # JWT 签名密钥（Base64 编码，至少 256 bit）
      # 生产环境必须配置固定密钥（多实例部署所有实例必须一致）：
      #   方式一：直接写 Base64 值    secret: <base64-key>
      #   方式二：环境变量注入        secret: ${JWT_SECRET}
      # 生成方式示例：openssl rand -base64 32
      # 留空时自动生成临时密钥（仅限开发，服务重启后所有 Token 失效）
      secret: QKVU5zsJYDzdi0V4aah27uVDAZTVLrpzpZGa8FRrLTk=
      # Access Token 有效期（毫秒），默认 24 小时
      access-token-expiration: 86400000
      # Refresh Token 有效期（毫秒），默认 7 天
      refresh-token-expiration: 604800000
    # 无需认证即可访问的路径（Ant 风格匹配）
    ignore-paths:
      - /api/auth/login
      - /api/auth/refresh
      - /api/captcha/**
      - /open/**

# ==================== Netty 长连接基座（gj-netty） ====================
# 设计文档：gj-core/gj-netty/GJ_NETTY_GUIDE.md；默认关闭，需要长连接能力的部署再开启
# 当前开启用于验证消息通知功能（gj-llm-notify）—— 验证后可回退为 false
gj:
  llm:
    auth:
      # 登录失败次数上限（滑动窗口内累计，达到即锁定；0=不启用）
      # max-login-failures: 5
      # 失败计数滑动窗口与账号锁定时长（分钟）
      # lock-duration-minutes: 30
      # 密码复杂度策略（创建用户/管理员重置/自助改密统一校验）
      # password-policy:
      #   enabled: true          # 是否启用复杂度校验
      #   min-length: 8          # 最小长度
      #   max-length: 100        # 最大长度
      #   min-categories: 3      # 大写/小写/数字/特殊字符四类至少包含几类
      #   forbid-username: true  # 是否禁止密码包含用户名
    captcha:
      # 滑动验证码开关（关闭后登录不校验、前端不渲染滑块；开关唯一真源在后端）
      enabled: true
      # 验证码有效期（秒），超时需刷新
      # expire-seconds: 120
      # 滑块位置校验容差（像素）
      # tolerance-px: 5
      # 单个验证码最大失败尝试次数，达到后作废并要求刷新
      # max-attempts: 3
      # 单 IP 每分钟最大生成次数（防刷）
      # gen-limit-per-minute: 30
    web:
      # 是否信任 X-Forwarded-For / X-Real-IP 解析客户端 IP（仅部署在可信反向代理之后时开启；
      # 直连部署时客户端可伪造该头，污染 IP 审计与验证码限流）
      trust-xff: false
    log:
      # 审计日志（操作日志/登录日志）保留天数，每日 03:30 自动清理；0=关闭自动清理
      retention-days: 90
  netty:
    enabled: true
    # port: 9090
    # path: /ws
    # heartbeat:
    #   read-idle-seconds: 60
    #   write-idle-seconds: 30
    # limits:
    #   max-frame-bytes: 65536
    #   max-connections-per-ip: 128      # 内网 NAT / 反代场景按部署形态调大（GUIDE 第七节）
    #   max-connections-per-principal: 8
    # dispatch:
    #   mode: virtual                    # 每会话顺序虚拟线程（JDK 25）
    # shutdown:
    #   grace-seconds: 10
