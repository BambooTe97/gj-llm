spring:
  application:
    name: gj-llm

  profiles:
    active: ai, mybatis, file, redis

  # ==================== 文件上传配置 ====================
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # ==================== 数据库配置 ====================
  datasource:
#    url: jdbc:mysql://localhost:3306/gj_llm?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    url: jdbc:mysql://192.168.50.109:3306/gj_llm?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
#    password: Xx123@pwd
    password: 111111
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    com.gj.llm: info
    org.springframework: warn
    org.springframework.web.servlet.mvc.method.annotation: warn

# ==================== 安全配置 ====================
app:
  security:
    jwt:
      # JWT 签名密钥（Base64 编码，至少 256 bit）
      # 留空时应用自动生成随机密钥（仅开发环境，重启后所有 Token 失效）
      # 生产环境务必配置固定密钥：secret: ${JWT_SECRET}
      secret: ""
      # Access Token 有效期（毫秒），默认 24 小时
      access-token-expiration: 86400000
      # Refresh Token 有效期（毫秒），默认 7 天
      refresh-token-expiration: 604800000
    # 无需认证即可访问的路径（Ant 风格匹配）
    ignore-paths:
      - /api/auth/login
      - /api/auth/refresh
      - /open/**

# ==================== Netty 长连接基座（gj-netty） ====================
# 设计文档：gj-core/gj-netty/GJ_NETTY_GUIDE.md；默认关闭，需要长连接能力的部署再开启
# 当前开启用于验证消息通知功能（gj-llm-notify）—— 验证后可回退为 false
gj:
  netty:
    enabled: true
