# =============================================================
# 基础模块 i18n 词条（中文为默认兜底文件；英文见 base_messages_en_US.properties）
# key 规范：<域>.<名词>.<现象> 小驼峰；占位 {0}、{1}…
# 新模块词条请独立 basename（如 i18n/chat_messages），禁止与本文件同名
# =============================================================

# ==================== 通用（GlobalExceptionHandler / 权限拦截器） ====================
common.requestParamError=请求参数错误
common.methodNotSupported=请求方法不支持
common.duplicateSubmit=数据已存在，请勿重复提交
common.serverError=服务器内部错误
auth.badCredentials=用户名或密码错误
auth.notAuthenticated401=认证失败，请重新登录
auth.accessDenied=权限不足
auth.apiNotOpen=该接口未开放访问权限

# ==================== 认证 ====================
auth.tokenInvalid=Token 已失效，请重新登录
auth.sessionInvalid=登录状态已失效，请重新登录
auth.notAuthenticated=未登录或认证信息缺失
auth.accountLocked=登录失败次数过多，账号已锁定，请 {0} 分钟后再试
auth.lockTriggered=密码错误次数已达 {0} 次，账号锁定 {1} 分钟

# ==================== 滑动验证码 ====================
captcha.genLimited=验证码获取过于频繁，请稍后再试
captcha.genFailed=验证码生成失败，请稍后再试
captcha.missing=请完成滑块验证
captcha.expired=验证码已过期，请刷新后重试
captcha.tooManyAttempts=滑块验证失败次数过多，请刷新验证码
captcha.wrongPosition=滑块位置不正确，请重试

# ==================== 用户 ====================
user.notFound=用户不存在: {0}
user.usernameExists=用户名已存在: {0}
user.builtinDeleteDenied=超级管理员不能删除

# ==================== 部门 ====================
dept.parentNotFound=父部门不存在: id={0}
dept.notFound=部门不存在: id={0}
dept.hasChildren=存在下级部门，不能删除
dept.hasUsers=部门下存在 {0} 个用户，不能删除
dept.cyclicMoveSelf=不能将部门移动到自身之下
dept.cyclicMove=不能移动到自身或下级部门下

# ==================== 角色 ====================
role.codeExists=角色编码已存在: {0}
role.notFound=角色不存在: id={0}
role.builtinDeleteDenied=内置角色不允许删除: {0}

# ==================== 菜单 ====================
menu.notFound=菜单不存在: id={0}
menu.hasChildren=存在子菜单，请先删除子节点
menu.parentNotFound=父菜单不存在: id={0}
menu.buttonAsParent=按钮类型不能作为父级菜单
menu.cyclicMove=不能将菜单移动到自身或下级菜单下
menu.idInvalid=存在无效的菜单 ID

# ==================== 字典 ====================
dictType.exists=字典类型已存在: {0}
dictType.notFound=字典类型不存在: {0}
dictType.hasData=该类型下存在 {0} 条字典数据，请先删除数据
dictData.notFound=字典数据不存在
dictData.valueExists=该类型下键值已存在: {0}

# ==================== 参数配置 ====================
config.keyExists=参数键名已存在: {0}
config.notFound=参数不存在
config.builtinDeleteDenied=内置参数不允许删除: {0}

# ==================== 消息通知 / 在线用户 / 缓存守卫 ====================
notify.receiverNotFound=接收用户不存在: {0}
online.sessionGone=会话不存在或已下线
cache.keyInvalid={0}格式不合法（仅限字母、数字、点、下划线、中划线，1-100 位）

# ==================== 密码复杂度策略 ====================
password.policy.violation={0}
password.policy.minLength=密码长度至少 {0} 位
password.policy.maxLength=密码长度不能超过 {0} 位
password.policy.minCategories=密码需包含大写字母、小写字母、数字、特殊字符中的至少 {0} 类
password.policy.forbidUsername=密码不能包含用户名
